[project]
name = "content-creator"
version = "0.1.0"
description = "Local beat-synchronized image video generator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pillow>=10.0",
  "librosa>=0.10",
  "numpy>=1.24",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "httpx[socks]>=0.28.1",
  "prompt-toolkit>=3.0.53",
]

[project.scripts]
content-creator = "content_creator.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_creator"]
