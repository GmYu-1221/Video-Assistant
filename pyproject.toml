[project]
name = "content-creator"
version = "0.1.0"
description = "Local beat-synchronized image video generator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pillow>=10.0",
  "librosa>=0.10",
  "numpy>=1.24",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "httpx[socks]>=0.28.1",
  "beautifulsoup4>=4.12",
  "trafilatura>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "playwright>=1.50",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_creator"]
