[project]
name = "content-creator"
version = "0.1.0"
description = "Local beat-synchronized image video generator"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pillow>=10.0",
  "librosa>=0.10",
  "numpy>=1.24",
]

[project.scripts]
content-creator = "content_creator.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_creator"]
